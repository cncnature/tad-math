name: Daily brief (Telegram)
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (UTC 22:00 전날)
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (비우면 오늘)"
        required: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then node scripts/send-telegram.js --date "${{ github.event.inputs.date }}"; else node scripts/send-telegram.js; fi
      - name: KakaoTalk (나에게 보내기, 설정된 경우만)
        if: ${{ env.KAKAO_REFRESH_TOKEN != '' }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then node scripts/send-kakao.js --date "${{ github.event.inputs.date }}"; else node scripts/send-kakao.js; fi
