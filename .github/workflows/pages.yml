# GitHub Pages 자동 배포: main 에 푸시될 때마다 사이트를 게시합니다.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 무결성 검사 (실패하면 배포하지 않음)
        run: |
          node scripts/check.js
          node scripts/send-telegram.js --dry > /dev/null
          node scripts/send-kakao.js --dry > /dev/null
          node scripts/audit.js --json > /dev/null
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 가 꺼져 있으면 자동으로 켭니다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
